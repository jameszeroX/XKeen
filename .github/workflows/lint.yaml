name: Lint (shellcheck diff-gate)

on:
  pull_request:
    paths:
      - '**/*.sh'
      - 'scripts/xkeen'
      - 'install.sh'
      - '.shellcheckrc'
      - '.github/shellcheck-baseline.txt'
      - '.github/workflows/lint.yaml'

jobs:
  shellcheck-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run shellcheck
        run: |
          docker run --rm -v "$PWD:/repo:ro" docker.io/koalaman/shellcheck-alpine:stable \
            sh -c 'cd /repo && shellcheck -s sh -f gcc scripts/xkeen install.sh $(find scripts/_xkeen -name "*.sh" | sort)' \
            > shellcheck-current.txt || true
          echo "current findings: $(wc -l < shellcheck-current.txt)"

      - name: Compare against baseline (fail only on new findings)
        run: |
          norm() { sed -E 's/^([^:]+):[0-9]+:[0-9]+: /\1: /' | sort -u; }
          norm < .github/shellcheck-baseline.txt > baseline.norm
          norm < shellcheck-current.txt > current.norm
          new=$(comm -13 baseline.norm current.norm)
          if [ -n "$new" ]; then
            echo "--- NEW shellcheck findings (not in .github/shellcheck-baseline.txt) ---"
            printf '%s\n' "$new"
          fi
          n=$(printf '%s\n' "$new" | grep -c . || true)
          echo "new count: $n"
          [ "$n" -eq 0 ]
